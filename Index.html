<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Loja</title>
<style>
:root{--bg:#f6f4f1;--c:#fff;--t:#222;--m:#777;--p:#b0476a;--ok:#2e8b57;--no:#c0392b;--b:#e5e0da}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--c:#252525;--t:#eee;--m:#999;--b:#3a3a3a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
main{max-width:760px;margin:auto;padding:14px}h2{margin:.2em 0 .6em}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{color:var(--m);font-size:.8rem}.v{font-size:1.4rem;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--no)}
input,select,button{font:inherit;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--p);color:#fff;border:0;cursor:pointer}button.s{background:none;color:var(--no);width:auto}
.it{display:grid;grid-template-columns:3fr 1fr 1.5fr auto;gap:6px;align-items:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 4px;color:var(--m);font-size:.9rem;cursor:pointer}nav a.on{color:var(--p);font-weight:700}
.sec{display:none}.sec.on{display:block}
</style></head><body><main>
<section id="resumo" class="sec on"><h2>Resumo</h2>
<div class="grid" id="kpis"></div>
<h3>Clientes devendo</h3><div id="devedores"></div></section>

<section id="nova" class="sec"><h2>Nova venda</h2><div class="card">
<input id="cli" placeholder="Nome do cliente"><input id="tel" type="tel" placeholder="Telefone">
<div class="k" style="margin-top:8px">Produtos</div><div id="itens"></div>
<button type="button" onclick="addItem()" style="background:var(--m)">+ Adicionar produto</button>
<div class="row" style="margin:10px 0"><b>Total</b><b id="tot">R$ 0,00</b></div>
<input id="ent" type="number" step="0.01" min="0" placeholder="Valor pago agora (opcional)">
<button type="button" id="bs" onclick="salvar()">Salvar venda</button></div></section>

<section id="pags" class="sec"><h2>Pagamentos</h2>
<input id="busca" placeholder="Buscar cliente..." oninput="listar()"><div id="lista"></div></section>
</main>
<nav><a class="on" data-t="resumo">📊 Resumo</a><a data-t="nova">➕ Venda</a><a data-t="pags">💰 Pagamentos</a></nav>

<script>
const $=id=>document.getElementById(id),R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),hoje=()=>new Date().toISOString().slice(0,10);
let D=[];
const pago=v=>v.pagamentos.reduce((s,p)=>s+ +p.valor,0),falta=v=>v.total-pago(v);
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a,.sec').forEach(e=>e.classList.remove('on'));a.classList.add('on');$(a.dataset.t).classList.add('on')});
function carregar(){google.script.run.withSuccessHandler(d=>{D=d;render()}).withFailureHandler(e=>alert('Erro: '+e.message)).getDados()}
function render(){
 const vend=D.reduce((s,v)=>s+ +v.total,0),rec=D.reduce((s,v)=>s+pago(v),0),dev={};
 D.forEach(v=>{if(falta(v)>0.009)dev[v.cliente]=(dev[v.cliente]||0)+falta(v)});
 const n=Object.keys(dev);
 $('kpis').innerHTML=[['Total vendido',R(vend)],['Recebido',R(rec),'ok'],['A receber',R(vend-rec),'no'],['Clientes devendo',n.length]]
  .map(([k,v,c])=>`<div class="card"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`).join('');
 $('devedores').innerHTML=n.sort((a,b)=>dev[b]-dev[a]).map(c=>`<div class="card row"><span>${c}</span><b class="no">${R(dev[c])}</b></div>`).join('')||'<div class="k">Ninguém devendo 🎉</div>';
 listar()}
function listar(){
 const q=$('busca').value.toLowerCase();
 $('lista').innerHTML=D.filter(v=>v.cliente.toLowerCase().includes(q)).reverse().map(v=>{
  const p=pago(v),f=falta(v),pc=v.total?Math.min(100,p/v.total*100):0;
  return `<div class="card"><div class="row"><b>${v.cliente}</b><span class="k">${v.data}</span></div>
  <div class="k">${v.itens.map(i=>i.qtd+'x '+i.nome).join(', ')}</div>
  <div class="bar"><i style="width:${pc}%"></i></div>
  <div class="row"><span>Total ${R(v.total)}</span><span class="ok">Pago ${R(p)}</span><b class="${f>0.009?'no':'ok'}">${f>0.009?'Falta '+R(f):'Quitado'}</b></div>
  ${f>0.009?`<div class="row"><input type="number" step="0.01" id="pv${v.id}" placeholder="Valor" style="flex:1"><select id="pf${v.id}" style="flex:1"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div><button onclick="pagar('${v.id}',${f})">Registrar pagamento</button>`:''}
  <button class="s" onclick="excluir('${v.id}')">Excluir venda</button></div>`}).join('')||'<div class="k">Nenhuma venda.</div>'}
function pagar(id,f){const val=+$('pv'+id).value;if(!(val>0))return alert('Informe o valor');if(val>f+0.009&&!confirm('Valor maior que o saldo. Continuar?'))return;
 google.script.run.withSuccessHandler(d=>{D=d;render()}).salvarPagamento({vendaId:id,data:hoje(),valor:val,forma:$('pf'+id).value})}
function excluir(id){if(confirm('Excluir esta venda e seus pagamentos?'))google.script.run.withSuccessHandler(d=>{D=d;render()}).excluirVenda(id)}
function addItem(){const d=document.createElement('div');d.className='it';
 d.innerHTML='<input placeholder="Produto"><input type="number" min="1" value="1"><input type="number" step="0.01" placeholder="Preço un."><button class="s" type="button">✕</button>';
 d.querySelectorAll('input').forEach(i=>i.oninput=total);d.querySelector('button').onclick=()=>{d.remove();total()};$('itens').appendChild(d)}
function itens(){return[...document.querySelectorAll('.it')].map(d=>{const i=d.querySelectorAll('input');return{nome:i[0].value.trim(),qtd:+i[1].value,preco:+i[2].value}}).filter(i=>i.nome&&i.qtd>0)}
function total(){$('tot').textContent=R(itens().reduce((s,i)=>s+i.qtd*i.preco,0))}
function salvar(){const it=itens(),c=$('cli').value.trim();if(!c||!it.length)return alert('Informe o cliente e ao menos um produto');
 const t=it.reduce((s,i)=>s+i.qtd*i.preco,0);$('bs').disabled=true;
 google.script.run.withSuccessHandler(d=>{D=d;render();$('cli').value=$('tel').value=$('ent').value='';$('itens').innerHTML='';addItem();total();$('bs').disabled=false;document.querySelector('[data-t=pags]').click()})
  .withFailureHandler(e=>{alert(e.message);$('bs').disabled=false}).salvarVenda({data:hoje(),cliente:c,telefone:$('tel').value,itens:it,total:t,entrada:+$('ent').value||0})}
addItem();carregar();
</script></body></html>
